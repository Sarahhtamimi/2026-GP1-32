
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | SIAQ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    try {
      if (localStorage.getItem("siaq-theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch (error) {}
  </script>

  <link rel="stylesheet" href="styles.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 85px 24px;
    }

    .auth-shell {
      width: min(850px, 100%);
      opacity: 1;
      transform: none;
    }

    .auth-top-actions {
      position: fixed;
      top: 22px;
      right: 26px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .auth-home-link {
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-home-link:hover {
      text-decoration: underline;
    }

    .auth-copy small {
      font-size: 11px;
      letter-spacing: 1.4px;
    }

    .auth-copy h2 {
      font-size: 34px;
      line-height: 1.15;
    }

    .auth-copy p {
      font-size: 14px;
      line-height: 1.6;
    }

    .auth-form > label {
      font-size: 13px;
      font-weight: 700;
    }

    .auth-form input {
      width: 100%;
      box-sizing: border-box;
      font-size: 14px;
    }

    .auth-form input::placeholder {
      font-size: 14px;
    }

    .auth-submit {
      font-size: 13px;
      font-weight: 700;
    }

    .auth-switch,
    .auth-switch .text-link {
      font-size: 12px;
    }

    .field-error {
      display: none;
      margin-top: 6px;
      color: #b42318;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
    }

    .auth-form label.invalid .field-error {
      display: block;
    }

    .auth-form label.invalid input {
      border-color: #d92d20 !important;
      box-shadow: 0 0 0 3px rgba(217, 45, 32, 0.07);
    }

    .auth-message {
      display: none;
      padding: 12px 14px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.55;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      color: #b42318;
      background: rgba(217, 45, 32, 0.07);
      border: 1px solid rgba(217, 45, 32, 0.16);
    }

    .auth-message.success {
      color: var(--teal);
      background: rgba(42, 140, 130, 0.09);
      border: 1px solid rgba(42, 140, 130, 0.18);
    }

    :root.dark .field-error {
      color: #ffaaa3;
    }

    :root.dark .auth-message.error {
      color: #ffb4ad;
      background: rgba(217, 45, 32, 0.10);
      border-color: rgba(255, 180, 173, 0.18);
    }

    @media (max-width: 600px) {
      .auth-page {
        padding: 85px 16px 50px;
      }

      .auth-top-actions {
        top: 15px;
        right: 16px;
      }

      .auth-copy h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- SIAQ Background -->
  <div class="siaq-architecture" aria-hidden="true">
    <div class="arch-grid"></div>
    <div class="arch-orb orb-teal"></div>
    <div class="arch-orb orb-sage"></div>
    <div class="arch-orb orb-sky"></div>
    <div class="arch-orb orb-cream"></div>
    <div class="arch-square sq-a"></div>
    <div class="arch-square sq-b"></div>
    <div class="arch-square sq-c"></div>
    <div class="arch-square sq-d"></div>
    <div class="arch-square sq-e"></div>
    <div class="arch-square sq-f"></div>
    <div class="arch-ring ring-a"></div>
    <div class="arch-ring ring-b"></div>
    <div class="arch-ring ring-c"></div>
    <div class="arch-beam beam-a"></div>
    <div class="arch-beam beam-b"></div>
  </div>

  <div class="scrollbar" id="scrollbar"></div>

  <!-- Back to Home and Theme Toggle -->
  <div class="auth-top-actions">
    <a class="auth-home-link" href="index.html">
      ← Back to Home
    </a>

    <button
      class="theme-toggle"
      id="themeToggle"
      type="button"
      aria-label="Switch theme"
      aria-pressed="false"
    >
      <span class="sun">☼</span>
      <span class="moon">☾</span>
    </button>
  </div>

  <main class="auth-page">
    <div class="auth-shell">

      <!-- Brand Panel -->
      <div class="auth-brand-panel">
        <div>
          <span class="signature-mark auth-mark">
            <i></i>
            <i></i>
            <i></i>
          </span>

          <b>SIAQ</b>

          <small>
            Social Intelligence Alignment Quotient
          </small>
        </div>

        <p>
          Evaluate conversational AI with context,
          human judgment, and cultural awareness.
        </p>

        <div class="auth-art">
          <i></i>
          <i></i>
          <i></i>
        </div>
      </div>

      <!-- Forgot Password Form -->
      <div class="auth-form-panel">

        <div class="auth-copy">
          <small>ACCOUNT RECOVERY</small>

          <h2>Forgot your password?</h2>

          <p>
            Enter your email address and we'll send
            you a link to reset your password.
          </p>
        </div>

        <form
          class="auth-form"
          id="forgotPasswordForm"
          novalidate
        >

          <label>
            Email address

            <input
              id="resetEmail"
              type="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            >

            <span class="field-error">
              Please enter a valid email address.
            </span>
          </label>

          <div
            class="auth-message"
            id="resetMessage"
            role="status"
            aria-live="polite"
          ></div>

          <button
            class="auth-submit"
            id="resetSubmit"
            type="submit"
          >
            Send Reset Link
            <span>→</span>
          </button>

          <div class="auth-switch">
            Remember your password?

            <a class="text-link" href="login.html">
              Back to Log In
            </a>
          </div>

        </form>
      </div>

    </div>
  </main>

 
<script src="script.js"></script>

<script type="module">
  import { auth } from "./js/firebase.js";

  import {
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  const resetForm = document.getElementById("forgotPasswordForm");
  const emailInput = document.getElementById("resetEmail");
  const resetMessage = document.getElementById("resetMessage");
  const resetSubmit = document.getElementById("resetSubmit");

  function showMessage(message, type = "error") {
    resetMessage.textContent = message;
    resetMessage.className = `auth-message show ${type}`;
  }

  function clearMessage() {
    resetMessage.textContent = "";
    resetMessage.className = "auth-message";
  }

  function showFieldError(message) {
    const label = emailInput.closest("label");
    const error = label.querySelector(".field-error");

    label.classList.add("invalid");
    error.textContent = message;
  }

  function clearFieldError() {
    emailInput.closest("label").classList.remove("invalid");
  }

  emailInput.addEventListener("input", () => {
    clearFieldError();
    clearMessage();
  });

  resetForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    clearFieldError();
    clearMessage();

    const email = emailInput.value.trim();
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!email) {
      showFieldError("Please enter your email address.");
      return;
    }

    if (!emailPattern.test(email)) {
      showFieldError("Please enter a valid email address.");
      return;
    }

    resetSubmit.disabled = true;
    resetSubmit.textContent = "Sending...";

    try {
      await sendPasswordResetEmail(auth, email);

      showMessage(
        "If an account exists with this email, a password reset link has been sent. Please check your inbox and spam folder.",
        "success"
      );

    } catch (error) {
      console.error("Password reset error:", error.code);

      if (error.code === "auth/invalid-email") {
        showFieldError("Please enter a valid email address.");

      } else if (error.code === "auth/too-many-requests") {
        showMessage(
          "Too many requests. Please wait a while before trying again."
        );

      } else if (error.code === "auth/network-request-failed") {
        showMessage(
          "Unable to connect. Please check your internet connection and try again."
        );

      } else {
        showMessage(
          "Unable to process your request right now. Please try again later."
        );
      }

    } finally {
      resetSubmit.disabled = false;
      resetSubmit.innerHTML = 'Send Reset Link <span>→</span>';
    }
  });
</script>

</body>
</html>
