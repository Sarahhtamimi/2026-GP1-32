
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | SIAQ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    try {
      if (localStorage.getItem("siaq-theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch (error) {}
  </script>

  <link rel="stylesheet" href="styles.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 85px 24px;
    }

    .auth-shell {
      width: min(950px, 100%);
      opacity: 1;
      transform: none;
    }

    .auth-top-actions {
      position: fixed;
      top: 22px;
      right: 26px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .auth-home-link {
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-home-link:hover {
      text-decoration: underline;
    }

    .auth-copy small {
      font-size: 11px;
      letter-spacing: 1.4px;
    }

    .auth-copy h2 {
      font-size: 34px;
      line-height: 1.15;
    }

    .auth-copy p {
      font-size: 14px;
      line-height: 1.6;
    }

    .auth-form > label {
      font-size: 13px;
      font-weight: 700;
    }

    .auth-form input {
      width: 100%;
      box-sizing: border-box;
      font-size: 14px;
    }

    .auth-form input::placeholder {
      font-size: 14px;
    }

    .auth-form .password-wrap {
      position: relative;
      width: 100%;
    }

    .auth-form .password-wrap input {
      padding-right: 70px !important;
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      margin: 0;
      padding: 5px;
      border: none;
      background: transparent;
      color: var(--teal);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-form .checkline {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      line-height: 1.5;
      cursor: pointer;
    }

    .auth-form .checkline input {
      width: auto;
      flex-shrink: 0;
      margin-top: 3px;
      accent-color: var(--teal);
    }

    .auth-submit {
      font-size: 13px;
      font-weight: 700;
    }

    .auth-switch,
    .auth-switch .text-link {
      font-size: 12px;
    }

    .field-error {
      display: none;
      margin-top: 6px;
      color: #b42318;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
    }

    .auth-form label.invalid .field-error {
      display: block;
    }

    .auth-form label.invalid input {
      border-color: #d92d20 !important;
      box-shadow: 0 0 0 3px rgba(217, 45, 32, 0.07);
    }

    .auth-message {
      display: none;
      margin: 0;
      padding: 12px 14px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.55;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      color: #b42318;
      background: rgba(217, 45, 32, 0.07);
      border: 1px solid rgba(217, 45, 32, 0.16);
    }

    .auth-message.success {
      color: var(--teal);
      background: rgba(42, 140, 130, 0.09);
      border: 1px solid rgba(42, 140, 130, 0.18);
    }

    :root.dark .field-error {
      color: #ffaaa3;
    }

    :root.dark .auth-message.error {
      color: #ffb4ad;
      background: rgba(217, 45, 32, 0.10);
      border-color: rgba(255, 180, 173, 0.18);
    }

    @media (max-width: 600px) {
      .auth-page {
        padding: 85px 16px 50px;
      }

      .auth-top-actions {
        top: 15px;
        right: 16px;
      }

      .auth-copy h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- SIAQ Background -->
  <div class="siaq-architecture" aria-hidden="true">
    <div class="arch-grid"></div>
    <div class="arch-orb orb-teal"></div>
    <div class="arch-orb orb-sage"></div>
    <div class="arch-orb orb-sky"></div>
    <div class="arch-orb orb-cream"></div>
    <div class="arch-square sq-a"></div>
    <div class="arch-square sq-b"></div>
    <div class="arch-square sq-c"></div>
    <div class="arch-square sq-d"></div>
    <div class="arch-square sq-e"></div>
    <div class="arch-square sq-f"></div>
    <div class="arch-ring ring-a"></div>
    <div class="arch-ring ring-b"></div>
    <div class="arch-ring ring-c"></div>
    <div class="arch-beam beam-a"></div>
    <div class="arch-beam beam-b"></div>
  </div>

  <div class="scrollbar" id="scrollbar"></div>

  <!-- Back to Home and Theme Toggle -->
  <div class="auth-top-actions">
    <a class="auth-home-link" href="index.html">
      ← Back to Home
    </a>

    <button
      class="theme-toggle"
      id="themeToggle"
      type="button"
      aria-label="Switch theme"
      aria-pressed="false"
    >
      <span class="sun">☼</span>
      <span class="moon">☾</span>
    </button>
  </div>

  <!-- Sign Up Page -->
  <main class="auth-page">
    <div class="auth-shell">

      <!-- Brand Panel -->
      <div class="auth-brand-panel">
        <div>
          <span class="signature-mark auth-mark">
            <i></i>
            <i></i>
            <i></i>
          </span>

          <b>SIAQ</b>

          <small>
            Social Intelligence Alignment Quotient
          </small>
        </div>

        <p>
          Evaluate conversational AI with context,
          human judgment, and cultural awareness.
        </p>

        <div class="auth-art">
          <i></i>
          <i></i>
          <i></i>
        </div>
      </div>

      <!-- Sign Up Form Panel -->
      <div class="auth-form-panel">

        <div class="auth-copy">
          <small>GET STARTED</small>

          <h2>Create your SIAQ account</h2>

          <p>
            Create an account to save evaluations
            and manage your alignment results.
          </p>
        </div>

        <form
          class="auth-form"
          id="signupForm"
          novalidate
        >

          <!-- First Name -->
          <label>
            First name

            <input
              id="firstName"
              type="text"
              placeholder="Your first name"
              autocomplete="given-name"
              maxlength="50"
            >

            <span class="field-error">
              Please enter your first name.
            </span>
          </label>

          <!-- Last Name -->
          <label>
            Last name

            <input
              id="lastName"
              type="text"
              placeholder="Your last name"
              autocomplete="family-name"
              maxlength="50"
            >

            <span class="field-error">
              Please enter your last name.
            </span>
          </label>

          <!-- Email -->
          <label>
            Email address

            <input
              id="signupEmail"
              type="email"
              placeholder="name@example.com"
              autocomplete="email"
            >

            <span class="field-error">
              Please enter a valid email address.
            </span>
          </label>

          <!-- Password -->
          <label>
            Password

            <div class="password-wrap">
              <input
                id="signupPassword"
                type="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
              >

              <button
                class="password-toggle"
                type="button"
                data-password="signupPassword"
                aria-label="Show password"
              >
                SHOW
              </button>
            </div>

            <span class="field-error">
              Password must be at least 8 characters
              and contain at least one letter and one number.
            </span>
          </label>

          <!-- Confirm Password -->
          <label>
            Confirm password

            <div class="password-wrap">
              <input
                id="signupConfirm"
                type="password"
                placeholder="Confirm your password"
                autocomplete="new-password"
              >

              <button
                class="password-toggle"
                type="button"
                data-password="signupConfirm"
                aria-label="Show password"
              >
                SHOW
              </button>
            </div>

            <span class="field-error">
              Passwords do not match.
            </span>
          </label>

          <!-- Terms and Conditions -->
          <label class="checkline">
            <input
              id="terms"
              type="checkbox"
            >

            <span>
              I agree to the Terms of Use
              and Privacy Policy.
            </span>
          </label>

          <!-- Firebase Messages -->
          <div
            class="auth-message"
            id="signupMessage"
            role="alert"
            aria-live="polite"
          ></div>

          <!-- Create Account -->
          <button
            class="auth-submit"
            type="submit"
          >
            Create account
            <span>→</span>
          </button>

          <!-- Login Link -->
          <div class="auth-switch">
            Already have an account?

            <a class="text-link" href="login.html">
              Log in
            </a>
          </div>

        </form>
      </div>

    </div>
  </main>

  <!-- Shared SIAQ Scripts -->
  <script src="script.js"></script>
  <script type="module" src="js/auth.js"></script>

</body>
</html>
